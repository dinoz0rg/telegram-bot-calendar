[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-bot-calendar"
version = "2.2.0"
description = "Inline calendar and date-range keyboards for Telegram bots."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["telegram", "calendar", "bot", "inline keyboard", "date picker"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dinoz0rg/telegram-bot-calendar"
Source = "https://github.com/dinoz0rg/telegram-bot-calendar"
Issues = "https://github.com/dinoz0rg/telegram-bot-calendar/issues"
Changelog = "https://github.com/dinoz0rg/telegram-bot-calendar/blob/main/CHANGELOG.md"

[project.optional-dependencies]
telethon = ["telethon"]
dev = ["pytest", "pytest-cov", "hypothesis", "mypy", "ruff", "build", "twine", "babel"]
docs = ["playwright"]

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_bot_calendar"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=telegram_bot_calendar --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.report]
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.format]
# The README quick start is kept compact on purpose (15 lines).
exclude = ["*.md", "src/telegram_bot_calendar/_locale_data.py"]  # generated

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Calendar labels use these on purpose: Cyrillic weekdays, arrows, dashes, markers.
allowed-confusables = ["В", "С", "×", "–", "‹", "›"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests", "docs", "scripts"]

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*", "playwright.*", "babel", "babel.*"]
ignore_missing_imports = true
